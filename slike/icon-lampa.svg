<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1c2547"/><stop offset="1" stop-color="#0b0f1c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffb020" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd04a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- light cone -->
  <path d="M262 196 L150 452 L410 452 L322 196 Z" fill="url(#cone)"/>
  <ellipse cx="290" cy="452" rx="140" ry="22" fill="#ffc23a" opacity=".55"/>
  <!-- glow -->
  <circle cx="292" cy="182" r="120" fill="url(#glow)"/>
  <!-- pole -->
  <path d="M150 460 V170 Q150 112 208 112 H262" fill="none" stroke="#3a4466" stroke-width="30" stroke-linecap="round"/>
  <path d="M150 460 V170 Q150 112 208 112 H262" fill="none" stroke="#5b6894" stroke-width="10" stroke-linecap="round" transform="translate(-6,0)"/>
  <rect x="118" y="440" width="64" height="26" rx="8" fill="#3a4466"/>
  <!-- lamp head -->
  <path d="M236 132 H348 L326 176 H258 Z" fill="#2b3352" stroke="#5b6894" stroke-width="6" stroke-linejoin="round"/>
  <rect x="284" y="100" width="16" height="34" rx="6" fill="#3a4466"/>
  <!-- bulb -->
  <ellipse cx="292" cy="184" rx="36" ry="18" fill="#fff4c2"/>
  <ellipse cx="292" cy="182" rx="22" ry="10" fill="#ffffff"/>
</svg>
